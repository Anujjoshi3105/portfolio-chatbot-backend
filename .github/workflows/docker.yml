name: Docker Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHub_username }}
          password: ${{ secrets.DOCKERHub_token }}

      - name: Extract Package Version
        id: extract_version
        run: echo "version=$(python -c "import re; print(re.search(r'version = [\"\\']([^\"\\']+)[\"\\']', open('pyproject.toml').read()).group(1))")" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            your-username/chatbot-backend:${{ steps.extract_version.outputs.version }}
            your-username/chatbot-backend:latest
          cache-from: type=registry,ref=your-username/chatbot-backend:buildcache
          cache-to: type=registry,ref=your-username/chatbot-backend:buildcache,mode=max

  deploy:
    name: Deploy to Hugging Face
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_NAME: chatbot-backend
        run: |
          hf space import ${{ secrets.HF_SPACE_OWNER }}/${{ env.SPACE_NAME }} --repo-type space
          echo "Deployed to Hugging Face Space"