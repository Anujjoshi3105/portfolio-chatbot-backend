name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.13.5"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Lint and format with ruff
      run: |
        uv run ruff format --check
        uv run ruff check --output-format github
    - name: Type check with mypy
      run: |
        uv run mypy
    - name: Test with pytest
      run: |
        uv run pytest --cov=src/ --cov-report=xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  lint-markdown:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.13.5"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen --only-group dev
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Lint markdown with pymarkdown
      run: |
        uv run pymarkdown scan README.md docs/

  test-docker:
    runs-on: ubuntu-latest

    services:
      dind:
        image: docker:dind
        ports:
          - 2375:2375
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Build service image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: chatbot.service:${{ github.sha }}
          file: Dockerfile

      - name: Start service container
        run: docker run -d --name service-container --network host -e USE_FAKE_MODEL=true -e PORT=7860 chatbot.service:${{ github.sha }}

      - name: Confirm service starts correctly
        run: |
          timeout 30 bash -c '
            while ! curl -s http://0.0.0.0:7860/health; do
              echo "Waiting for service to be ready..."
              docker logs service-container
              sleep 2
            done
          '

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.13.5"
      - name: Install ONLY CLIENT dependencies with uv
        run: |
          uv sync --frozen --only-group client --only-group dev
        env:
          UV_SYSTEM_PYTHON: 1
      - name: Run smoke test
        run: |
          uv run python scripts/smoke_test.py
        env:
          AGENT_URL: http://0.0.0.0:7860

      - name: Clean up containers
        if: always()
        run: |
          docker stop service-container || true
          docker rm service-container || true
