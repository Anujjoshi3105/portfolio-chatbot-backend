[project]
name = "hf-chatbot-backend"
version = "0.1.0"
description = "Hugging Face Spaces backend for persistent chatbot and file storage system"
readme = "README.md"
authors = [{ name = "Anuj Joshi", email = "anujjoshi3105@gmail.com" }]
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi ~=0.141.0",
    "sqlalchemy >=2.0.0",
    "pydantic ~=2.13.4",
    "pydantic-settings ~=2.15.0",
    "uvicorn ~=0.32.1",
    "httpx ~=0.28.0",
    "python-multipart ~=0.0.20",
    "aiofiles >=23.2.0",
    "python-dotenv >=1.0.0",
    "alembic >=1.13.0",
    "aiosqlite >=0.20.0",
    "asyncpg >=0.29.0",  # for Postgres support
    "sqlalchemy-utils >=0.40.0",
    "langchain-nvidia-ai-endpoints >=1.0.4",
    "chromadb >=1.0.0",
    "huggingface-hub >=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"